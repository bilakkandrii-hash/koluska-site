<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0">
<title>Koluska — щоденник перших днів вашого малюка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Supabase (хмара) і JSZip (експорт). Версії зафіксовані. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== Koluska brand tokens (Брендбук v1.0) ===== */
:root{
  --bg:#FBF6F0;          /* milk */
  --raised:#FFFDF9;      /* milk-raised: картки */
  --text:#3B2B2F;        /* ink */
  --muted:#76605F;       /* ink muted */
  --line:#EADFD4;        /* line */
  --rose:#A64C38;        /* головна дія, посилання */
  --on-rose:#FFFFFF;
  --rose-text:#A64C38;
  --bloom:#E08A72;       /* знак, декор — не текст */
  --honey:#E2AE4E;       /* крапка-малюк, віхи — не текст */
  --sage:#4F6B4C;        /* здоров'я, спокій */
  --sage-text:#4F6B4C;
  --rose-soft:#F8E3DA; --honey-soft:#FBEFD3; --sage-soft:#E4ECDD;
  --overlay:rgba(59,43,47,.38);
  --shadow:0 1px 2px rgba(59,43,47,.04),0 8px 24px rgba(59,43,47,.07);
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Nunito",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1A1C; --raised:#2A2326; --text:#F5ECE6; --muted:#BBA9AC; --line:#3D3337;
    --rose:#EE9A84; --on-rose:#1F1A1C; --rose-text:#EE9A84; --bloom:#E08A72; --honey:#F0C673;
    --sage:#A9C3A2; --sage-text:#A9C3A2;
    --rose-soft:#4A2A23; --honey-soft:#3D3020; --sage-soft:#263222;
    --overlay:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1A1C; --raised:#2A2326; --text:#F5ECE6; --muted:#BBA9AC; --line:#3D3337;
  --rose:#EE9A84; --on-rose:#1F1A1C; --rose-text:#EE9A84; --bloom:#E08A72; --honey:#F0C673;
  --sage:#A9C3A2; --sage-text:#A9C3A2;
  --rose-soft:#4A2A23; --honey-soft:#3D3020; --sage-soft:#263222;
  --overlay:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
img{max-width:100%}

/* ----- Logo ----- */
.mark{display:block;flex:none}
.mark .cradle{fill:var(--bloom)}
.mark .baby{fill:var(--honey)}
.wordmark{font-family:var(--sans);font-weight:800;font-size:25px;letter-spacing:-.02em;color:var(--text);white-space:nowrap;line-height:1}

/* ----- Auth ----- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.auth .deco{position:absolute;inset:0;pointer-events:none}
.auth-card{position:relative;width:100%;max-width:420px;background:var(--raised);border-radius:28px;padding:36px 28px 28px;box-shadow:var(--shadow)}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.auth h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:36px;text-align:center;margin:0 0 6px}
.auth p.sub{color:var(--muted);text-align:center;margin:0 0 22px}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;min-height:40px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
.auth .note{font-size:13px;line-height:18px;color:var(--muted);margin:16px 0 0;text-align:center}
.err{color:var(--rose-text);font-size:14px;min-height:20px;margin:2px 0 8px;font-weight:600}

/* ----- Layout ----- */
.app{display:flex;height:100%}
.sb{width:268px;flex:none;background:var(--raised);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;transition:width .2s ease;overflow:hidden}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 18px;gap:8px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--bg)}
.child-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:24px;background:var(--rose-soft);border:0;width:100%;text-align:left;margin-bottom:16px;min-height:60px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--rose-soft);color:var(--text);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;border:2px solid var(--raised)}
.avatar img{width:100%;height:100%;object-fit:cover}
.child-card .meta{min-width:0}
.child-card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.child-card small{color:var(--muted);white-space:nowrap;font-size:13px}
nav.menu{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:999px;border:0;background:none;color:var(--text);font-weight:600;text-align:left;white-space:nowrap;width:100%}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--soft);font-weight:800}
.nav-item .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
.sb-sep{height:1px;background:var(--line);margin:8px 6px}
.sb-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.lang{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 14px}
.lang select{border:0;background:none;flex:1;font-weight:700;outline:none}
.user-row{display:flex;align-items:center;gap:10px;padding:2px 4px}
.user-row .meta{min-width:0;flex:1}
.user-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-row small{color:var(--muted);display:block;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.collapsed .sb{width:80px}
.app.collapsed .lbl,.app.collapsed .child-card .meta,.app.collapsed .user-row .meta,.app.collapsed .lang select,.app.collapsed .nav-item .dot{display:none}
.app.collapsed .sb-head{flex-direction:column;gap:12px;padding-bottom:14px}
.app.collapsed .child-card{justify-content:center;background:none;padding:4px}
.app.collapsed .nav-item{justify-content:center;padding:0}
.app.collapsed .lang{justify-content:center;border:0;padding:0}
.app.collapsed .user-row{flex-direction:column}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}

.main{flex:1;min-width:0;overflow-y:auto;height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:20px 32px 12px}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:32px;line-height:40px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.content{padding:4px 32px 112px;max-width:1100px;width:100%;flex:1}
.section-head{background:var(--soft);border-radius:24px;padding:18px 22px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
.section-head p{margin:0;max-width:60ch}

/* Main action — always at the bottom, under the thumb */
.fab-wrap{position:fixed;right:32px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.timer{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--raised);border-radius:999px;padding:8px 8px 8px 10px;box-shadow:0 8px 28px rgba(59,43,47,.16);min-width:340px}
.timer .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.timer .tb small{color:var(--muted);font-weight:700;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tb b{font-size:24px;line-height:30px;font-weight:800;font-variant-numeric:tabular-nums}
.timer .since{color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.timer .run{width:10px;height:10px;border-radius:50%;background:var(--rose);display:inline-block;margin-right:6px;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.starts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.starts p{margin:0 4px 0 0;color:var(--muted);font-weight:600;width:100%}
.hidden{display:none!important}
.loading{min-height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:700}
.loading .mark{margin:0 auto 12px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.92);opacity:.7}}
.info{background:var(--sage-soft);color:var(--text);border-radius:16px;padding:12px 14px;font-size:14px;line-height:20px;margin-bottom:14px;font-weight:600}
.trash-row{display:flex;gap:12px;align-items:center;background:var(--raised);border-radius:24px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.trash-row .b{flex:1;min-width:180px}
.trash-row .b small{color:var(--muted);display:block;font-size:14px}
.trash-list{display:grid;gap:10px}
.trash-row .btn{min-height:44px;padding:0 16px}
.fab{pointer-events:auto;box-shadow:0 8px 24px rgba(166,76,56,.28);padding:0 28px;min-height:56px;font-size:17px}

/* ----- Components ----- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--raised);min-height:48px;padding:0 22px;font-weight:800;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.btn.primary:hover{filter:brightness(1.07);background:var(--rose)}
.btn.soft{background:var(--rose-soft);border-color:transparent}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{border-color:transparent;background:var(--rose-soft);color:var(--rose-text)}
.btn.block{width:100%}
.btn svg.i{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:16px;min-height:48px;padding:11px 16px;outline:none;min-width:0}
.field textarea{min-height:96px;resize:vertical;font-family:var(--serif);font-style:italic;font-size:17px;line-height:26px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--raised);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 14px;font-size:22px;line-height:30px;font-weight:800}
.panel p.quiet{color:var(--muted);margin:0}
.label{display:inline-block;font-size:12px;line-height:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--lc)}

/* Hero */
.hero{background:var(--raised);border-radius:28px;padding:26px 28px;display:flex;gap:22px;align-items:center;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .avatar{width:84px;height:84px;font-size:32px;border-width:3px}
.hero .age{font-size:clamp(28px,4.6vw,44px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero .who{color:var(--muted);font-weight:600;margin-top:6px}
.hero .moon{position:absolute;right:24px;top:50%;transform:translateY(-50%);opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--raised);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;font-size:14px}
.stat small i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.stat b{font-size:24px;line-height:32px;font-weight:800}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{display:flex;align-items:center;gap:10px;border:0;background:var(--soft);border-radius:999px;min-height:48px;padding:0 14px;font-weight:700;text-align:left}
.quick button:hover{filter:brightness(.97)}

/* Memory cards */
.cards{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--raised);border:0;border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;color:var(--text)}
.card:hover{box-shadow:0 0 0 2px var(--line),var(--shadow)}
.card .ph{width:calc(100% + 40px);margin:-18px -20px 8px;aspect-ratio:4/3;object-fit:cover;border-radius:24px 24px 0 0}
.card .meta{color:var(--muted);font-size:14px;line-height:20px;font-weight:600}
.card .ttl{font-weight:800;font-size:17px;line-height:24px}
.card .txt{font-family:var(--serif);font-style:italic;font-size:18px;line-height:27px;white-space:pre-wrap;overflow-wrap:anywhere}
.card .word{font-family:var(--serif);font-style:italic;font-size:26px;line-height:34px}
.card .hint{font-size:14px;line-height:20px;color:var(--sage-text);font-weight:600}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;border:0;background:none;padding:10px 4px;border-radius:16px;text-align:left;width:100%;cursor:pointer}
.row:hover{background:var(--bg)}
.row .b{min-width:0;flex:1}
.row .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b small{color:var(--muted);font-size:14px}
.sw{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--lc);flex:none}
.sw svg.i{width:20px;height:20px}

.empty{text-align:center;padding:44px 20px 36px;background:var(--raised);border-radius:24px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:32px;margin:14px 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:36ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:0;background:var(--raised);box-shadow:var(--shadow);border-radius:999px;min-height:44px;padding:0 16px;font-weight:700}
.chip:hover{background:var(--honey-soft)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;color:var(--muted)}
.chart .cap b{font-size:22px;color:var(--text)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kid{display:flex;gap:12px;align-items:center;background:var(--raised);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow)}
.kid.on{box-shadow:0 0 0 2px var(--rose),var(--shadow)}
.kid .meta{flex:1;min-width:0}
.kid .meta small{color:var(--muted);display:block;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--muted);margin:2px 0 12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--rose);flex:none;margin:0}
.link{border:0;background:none;padding:0;color:var(--rose-text);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:inherit}
.field input.bad{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.settings{display:grid;gap:16px;max-width:660px}
.settings .panel h2{font-size:18px;line-height:24px;margin:0 0 4px}
.set-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 0;text-align:left;min-height:56px}
.set-link:last-child{border-bottom:0}
.set-link small{color:var(--muted);display:block;font-size:14px;font-weight:400}
.set-link .chev{color:var(--muted)}
.set-link:hover b{color:var(--rose-text)}
.legal{font-size:16px;line-height:26px;white-space:pre-wrap}
.contacts{display:grid;gap:8px}
.contacts a{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:999px;min-height:52px;padding:0 18px;color:var(--text);text-decoration:none;font-weight:700}
.contacts a small{color:var(--muted);font-weight:600;margin-left:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row small{color:var(--muted);display:block;font-size:14px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--raised);border-radius:28px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:26px 24px 22px;box-shadow:var(--shadow);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal h3{margin:0 0 18px;font-size:22px;line-height:30px;font-weight:800;display:flex;align-items:center;gap:12px}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.actions .sp{flex:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:flex;align-items:center;gap:12px;border:0;background:var(--soft);border-radius:24px;min-height:64px;padding:0 16px;font-weight:800;text-align:left}
.photo-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-box img{width:88px;height:88px;object-fit:cover;border-radius:24px}
.photo-box label.btn{cursor:pointer;color:var(--text);font-size:15px}
.modal-wrap.top{z-index:55}
.toast{width:max-content;position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.backdrop{display:none}

@media (max-width:860px){
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .22s ease;width:284px!important;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .app.collapsed .lbl,.app.collapsed .lang select{display:initial}
  .app.collapsed .child-card .meta,.app.collapsed .user-row .meta{display:block}
  .app.collapsed .nav-item .dot{display:block}

<script>
/* =========================================================
   Koluska — прототип за брендбуком v1.0.
   Дані зберігаються в браузері (localStorage). Для продакшну
   замініть Store + Auth на Supabase/Firebase — інтерфейс не зміниться.
   ========================================================= */
const APP = 'Koluska';
const PREFIX = 'koluska:';

/* ---------- Storage ---------- */
const mem = {};
const Store = {
  get(k, def){ try{ const v = localStorage.getItem(PREFIX+k); return v!=null ? JSON.parse(v) : (k in mem ? mem[k] : def); }catch(e){ return k in mem ? mem[k] : def; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); return true; }catch(e){ toast('Не вдалося зберегти: пам’ять заповнена. Приберіть кілька фото.'); return false; } },
  del(k){ delete mem[k]; try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
};

/* =========================================================
   НАЛАШТУВАННЯ ХМАРИ
   Вставте сюди Project URL і anon (publishable) key з Supabase:
   Project Settings → API. Обидва ключі публічні — їх можна тримати в коді.
   Поки поля порожні, сайт працює в демо-режимі (дані лише в браузері).
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZHdjenRqZnBqYndxa2R2aWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODI0NzgsImV4cCI6MjEwNzU1ODQ3OH0.aY_i2lNnxeI0iEcHr_dMXRZaJYReEvH0RrSF6ZQ5xuE',
  SUPABASE_ANON_KEY: 'dadwcztjfpjbwqkdvidq'
};
const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
const sb = CLOUD ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const NET = 'Не вдалося зберегти. Перевірте інтернет — ми нічого не загубили.';
const TRASH_DAYS = 30;

async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function dataUrlToBlob(u){
  const [head, b64] = u.split(','), mime = (head.match(/data:([^;]+)/)||[])[1] || 'image/jpeg';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : uid());

/* Перевірка форми реєстрації — спільна для обох режимів */
function validateSignUp(f){
  const email = f.email.trim().toLowerCase(), phone = normPhone(f.phone);
  if(!f.name.trim()) throw ['name','Як вас звати?'];
  if(!/^\S+@\S+\.\S+$/.test(email)) throw ['email','Перевірте email.'];
  if(!phone) throw ['phone','Перевірте номер телефону, напр. +380 67 123 45 67.'];
  if(f.pass.length < 6) throw ['pass','Пароль — щонайменше 6 символів.'];
  if(!f.terms) throw ['terms','Погодьтеся з умовами, щоб продовжити.'];
  return { name:f.name.trim(), email, phone, pass:f.pass, news:!!f.news, termsAt:new Date().toISOString() };
}

/* ---------- Режим 1: демо (localStorage) ---------- */
const Local = {
  async signUp(v){
    const users = Store.get('users', {});
    if(users[v.email]) throw ['email','Цей email уже з нами. Увійдіть.'];
    const salt = uid();
    users[v.email] = { name:v.name, phone:v.phone, news:v.news, termsAt:v.termsAt, salt, hash: await sha(salt+v.pass) };
    Store.set('users', users); Store.set('session', v.email);
    return { needsConfirm:false };
  },
  async signIn(email, pass){
    email = email.trim().toLowerCase();
    const u = Store.get('users', {})[email];
    if(!u || u.hash !== await sha(u.salt+pass)) throw 'Email або пароль не підходять.';
    Store.set('session', email);
  },
  async signOut(){ Store.del('session'); },
  async getUser(){
    const e = Store.get('session', null), u = Store.get('users', {})[e];
    return u ? { id:e, email:e, name:u.name, phone:u.phone||'', news:!!u.news } : null;
  },
  async resetPassword(){ throw 'У демо-режимі відновлення пароля недоступне.'; },
  async updatePassword(){},
  async updateProfile(p){ const users = Store.get('users',{}); Object.assign(users[user.id], p); Store.set('users', users); },
  _db(){ const d = Store.get('data:'+user.id, null) || {}; return { children:d.children||[], entries:d.entries||{}, timers:d.timers||{} }; },
  _put(d){ if(!Store.set('data:'+user.id, d)) throw 'Не вдалося зберегти: пам’ять браузера заповнена.'; },
  async load(){
    const d = this._db(), kids = d.children.filter(c=>!c.deleted_at), alive = new Set(kids.map(c=>c.id));
    const entries = {}; Object.entries(d.entries).forEach(([b,l])=>entries[b] = l.filter(e=>!e.deleted_at && alive.has(e.childId)));
    return { children:kids, entries, timers:d.timers };
  },
  async saveChild(c){ const d = this._db(); c = { ...c, id:c.id||newId() }; const i = d.children.findIndex(x=>x.id===c.id); i<0 ? d.children.push(c) : d.children[i] = { ...d.children[i], ...c }; this._put(d); return c; },
  async deleteChild(id){ const d = this._db(); const c = d.children.find(x=>x.id===id); if(c) c.deleted_at = new Date().toISOString(); this._put(d); },
  async saveEntry(b, e){ const d = this._db(); e = { ...e, id:e.id||newId() }; const l = d.entries[b] = d.entries[b]||[]; const i = l.findIndex(x=>x.id===e.id); i<0 ? l.push(e) : l[i] = e; this._put(d); return e; },
  async deleteEntry(b, id){ const d = this._db(); const e = (d.entries[b]||[]).find(x=>x.id===id); if(e) e.deleted_at = new Date().toISOString(); this._put(d); },
  async trash(){
    const d = this._db(), since = Date.now() - TRASH_DAYS*864e5, fresh = x => x.deleted_at && Date.parse(x.deleted_at) > since;
    const dead = new Set(d.children.filter(c=>c.deleted_at).map(c=>c.id));
    return { children:d.children.filter(fresh), entries:Object.entries(d.entries).flatMap(([b,l])=>l.filter(e=>fresh(e) && !dead.has(e.childId)).map(e=>({b,e}))), names:Object.fromEntries(d.children.map(c=>[c.id,c.name])) };
  },
  async restore(kind, id){ const d = this._db(); const x = kind==='child' ? d.children.find(c=>c.id===id) : Object.values(d.entries).flat().find(e=>e.id===id); if(x) delete x.deleted_at; this._put(d); },
  async purge(kind, id){
    const d = this._db();
    if(kind==='child'){ d.children = d.children.filter(c=>c.id!==id); Object.keys(d.entries).forEach(b=>d.entries[b]=d.entries[b].filter(e=>e.childId!==id)); delete d.timers[id]; }
    else Object.keys(d.entries).forEach(b=>d.entries[b]=d.entries[b].filter(e=>e.id!==id));
    this._put(d);
  },
  async setTimer(childId, T){ const d = this._db(); if(T) d.timers[childId] = T; else delete d.timers[childId]; this._put(d); },
  async wipe(){ const d = this._db(), now = new Date().toISOString(); d.children.forEach(c=>{ if(!c.deleted_at) c.deleted_at = now; }); this._put(d); },
  async uploadPhoto(dataUrl){ return dataUrl; },
  photoUrl(ref){ return ref || ''; },
  async photoBlob(ref){ return dataUrlToBlob(ref); }
};

/* ---------- Режим 2: хмара (Supabase) ---------- */
const photoCache = {};
const chk = r => { if(r && r.error){ console.error(r.error); throw NET; } return r; };
function authErr(e){
  const m = (e && e.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'Email або пароль не підходять.';
  if(m.includes('already registered') || m.includes('already been registered')) return ['email','Цей email уже з нами. Увійдіть.'];
  if(m.includes('not confirmed')) return 'Підтвердьте email — лист уже на вашій пошті.';
  if(m.includes('rate') || m.includes('security purposes')) return 'Забагато спроб. Спробуйте за хвилину.';
  if(m.includes('password')) return ['pass','Пароль — щонайменше 6 символів.'];
  console.error(e); return 'Не вдалося. Перевірте інтернет і спробуйте ще раз.';
}
const rowToChild = r => ({ id:r.id, name:r.name, birth:r.birth, sex:r.sex||'', photo:r.photo||'', deleted_at:r.deleted_at });
const rowToEntry = r => ({ ...(r.payload||{}), id:r.id, childId:r.child_id, date:r.date, photo:r.photo||'', deleted_at:r.deleted_at, _b:r.block });
const Cloud = {
  async signUp(v){
    const { data:r, error } = await sb.auth.signUp({ email:v.email, password:v.pass, options:{
      data:{ name:v.name, phone:v.phone, news:v.news, terms_at:v.termsAt }, emailRedirectTo: location.origin + location.pathname } });
    if(error) throw authErr(error);
    if(r.user && Array.isArray(r.user.identities) && r.user.identities.length===0) throw ['email','Цей email уже з нами. Увійдіть.'];
    return { needsConfirm: !r.session };
  },
  async signIn(email, pass){ const { error } = await sb.auth.signInWithPassword({ email:email.trim().toLowerCase(), password:pass }); if(error) throw authErr(error); },
  async signOut(){ await sb.auth.signOut(); },
  async getUser(){
    const { data:{ session } } = await sb.auth.getSession(); if(!session) return null;
    const u = session.user, { data:p } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
    return { id:u.id, email:u.email, name:p?.name || u.user_metadata?.name || '', phone:p?.phone || '', news:!!p?.news };
  },
  async resetPassword(email){ const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: location.origin + location.pathname }); if(error) throw authErr(error); },
  async updatePassword(pw){ const { error } = await sb.auth.updateUser({ password:pw }); if(error) throw authErr(error); },
  async updateProfile(p){ chk(await sb.from('profiles').update(p).eq('id', user.id)); },
  async load(){
    const [c, e, t] = await Promise.all([
      sb.from('children').select('*').is('deleted_at', null).order('created_at'),
      sb.from('entries').select('*').is('deleted_at', null).order('date', { ascending:false }),
      sb.from('timers').select('*') ]);
    [c,e,t].forEach(chk);
    const children = c.data.map(rowToChild), alive = new Set(children.map(x=>x.id)), entries = {};
    e.data.filter(r=>alive.has(r.child_id)).forEach(r=>{ const x = rowToEntry(r); (entries[r.block] = entries[r.block] || []).push(x); });
    const timers = {}; t.data.forEach(r=>timers[r.child_id] = { type:r.type, kind:r.kind||'', start:Date.parse(r.started_at) });
    await this.signPhotos([...children.map(x=>x.photo), ...e.data.map(r=>r.photo)]);
    return { children, entries, timers };
  },
  async signPhotos(paths){
    paths = [...new Set(paths.filter(p=>p && !p.startsWith('data:') && !photoCache[p]))];
    for(let i=0;i<paths.length;i+=100){
      const { data } = await sb.storage.from('photos').createSignedUrls(paths.slice(i,i+100), 60*60*24);
      (data||[]).forEach(x=>{ if(x.signedUrl) photoCache[x.path] = x.signedUrl; });
    }
  },
  async saveChild(c){
    const row = { name:c.name, birth:c.birth, sex:c.sex||null, photo:c.photo||null };
    const r = chk(c.id ? await sb.from('children').update(row).eq('id', c.id).select().single() : await sb.from('children').insert(row).select().single());
    return rowToChild(r.data);
  },
  async deleteChild(id){ chk(await sb.from('children').update({ deleted_at:new Date().toISOString() }).eq('id', id)); },
  async saveEntry(b, e){
    const { id, childId, date, photo, deleted_at, _b, ...payload } = e;
    const row = { block:b, child_id:childId, date, photo:photo||null, payload };
    const r = chk(id ? await sb.from('entries').update(row).eq('id', id).select().single() : await sb.from('entries').insert(row).select().single());
    return rowToEntry(r.data);
  },
  async deleteEntry(b, id){ chk(await sb.from('entries').update({ deleted_at:new Date().toISOString() }).eq('id', id)); },
  async trash(){
    const since = new Date(Date.now() - TRASH_DAYS*864e5).toISOString();
    const [c, e, all] = await Promise.all([
      sb.from('children').select('*').not('deleted_at','is',null).gt('deleted_at', since).order('deleted_at', { ascending:false }),
      sb.from('entries').select('*').not('deleted_at','is',null).gt('deleted_at', since).order('deleted_at', { ascending:false }),
      sb.from('children').select('id,name,deleted_at') ]);
    [c,e,all].forEach(chk);
    const dead = new Set(all.data.filter(x=>x.deleted_at).map(x=>x.id));
    await this.signPhotos(e.data.map(r=>r.photo));
    return { children:c.data.map(rowToChild), entries:e.data.filter(r=>!dead.has(r.child_id)).map(r=>({ b:r.block, e:rowToEntry(r) })), names:Object.fromEntries(all.data.map(x=>[x.id,x.name])) };
  },
  async restore(kind, id){ chk(await sb.from(kind==='child'?'children':'entries').update({ deleted_at:null }).eq('id', id)); },
  async purge(kind, id){
    const paths = kind==='child'
      ? [ ...(chk(await sb.from('children').select('photo').eq('id', id)).data.map(r=>r.photo)), ...(chk(await sb.from('entries').select('photo').eq('child_id', id)).data.map(r=>r.photo)) ]
      : chk(await sb.from('entries').select('photo').eq('id', id)).data.map(r=>r.photo);
    chk(await sb.from(kind==='child'?'children':'entries').delete().eq('id', id));
    const files = paths.filter(p=>p && !p.startsWith('data:'));
    if(files.length) await sb.storage.from('photos').remove(files);
  },
  async setTimer(childId, T){
    chk(T ? await sb.from('timers').upsert({ child_id:childId, type:T.type, kind:T.kind||null, started_at:new Date(T.start).toISOString() })
          : await sb.from('timers').delete().eq('child_id', childId));
  },
  async wipe(){ chk(await sb.from('children').update({ deleted_at:new Date().toISOString() }).is('deleted_at', null)); },
  async uploadPhoto(dataUrl){
    const path = `${user.id}/${newId()}.jpg`;
    const { error } = await sb.storage.from('photos').upload(path, dataUrlToBlob(dataUrl), { contentType:'image/jpeg' });
    if(error){ console.error(error); throw 'Не вдалося завантажити фото. Перевірте інтернет.'; }
    photoCache[path] = dataUrl; return path;
  },
  photoUrl(ref){ return !ref ? '' : ref.startsWith('data:') ? ref : (photoCache[ref] || ''); },
  async photoBlob(ref){ if(ref.startsWith('data:')) return dataUrlToBlob(ref); const { data, error } = await sb.storage.from('photos').download(ref); if(error) throw NET; return data; }
};
const API = CLOUD ? Cloud : Local;
const errText = e => Array.isArray(e) ? e[1] : (typeof e==='string' ? e : NET);
async function busy(btn, fn){
  const old = btn ? btn.innerHTML : ''; if(btn){ btn.disabled = true; btn.textContent = 'Зберігаємо…'; }

}

/* Телефон: приймаємо 067…, +380…, з пробілами чи дужками → +380XXXXXXXXX */
function normPhone(p){
  let d = String(p||'').replace(/\D/g,'');
  if(d.length===10 && d[0]==='0') d = '38'+d;
  if(d.length===9) d = '380'+d;
  return d.length>=11 && d.length<=15 ? '+'+d : null;
}
const fmtPhone = p => { const m = /^\+380(\d{2})(\d{3})(\d{2})(\d{2})$/.exec(p||''); return m ? `+380 ${m[1]} ${m[2]} ${m[3]} ${m[4]}` : (p||''); };

/* ---------- Тексти й контакти — замініть на свої ---------- */
const LEGAL = {
  privacy:{ title:'Політика конфіденційності', text:'Текст політики конфіденційності буде тут.\n\nЗамініть цей текст у константі LEGAL.privacy у коді.' },
  terms:{ title:'Умови використання', text:'Текст умов використання буде тут.\n\nЗамініть цей текст у константі LEGAL.terms у коді.' }
};

};

/* ---------- Helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { d = new Date(d); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const today = () => iso(new Date());
function fmtDate(d){
  if(!d) return '';
  const x = new Date(d+'T12:00'), y = x.getFullYear() !== new Date().getFullYear();
  return x.toLocaleDateString('uk-UA', y ? {day:'numeric',month:'long',year:'numeric'} : {day:'numeric',month:'long'});
}
function plural(n,a,b,c){ const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c; }
function ageParts(birth, at){
  if(!birth) return null;
  const b = new Date(birth+'T12:00'), t = at ? new Date(at+'T12:00') : new Date();
  if(t < b) return null;
  let m = (t.getFullYear()-b.getFullYear())*12 + t.getMonth()-b.getMonth(), d = t.getDate()-b.getDate();
  if(d < 0){ m--; d += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); }
  return { y:Math.floor(m/12), m:m%12, d, days:Math.floor((t-b)/864e5) };
}
function ageStr(birth, at, long){
  const a = ageParts(birth, at); if(!a) return '';
  if(a.y===0 && a.m===0) return a.days<14 ? `${a.days} ${plural(a.days,'день','дні','днів')}` : `${Math.floor(a.days/7)} ${plural(Math.floor(a.days/7),'тиждень','тижні','тижнів')}`;
  const p = [];
  if(a.y) p.push(`${a.y} ${plural(a.y,'рік','роки','років')}`);
  if(a.m) p.push(`${a.m} ${plural(a.m,'місяць','місяці','місяців')}`);
  if(long && a.d && a.y<1) p.push(`${a.d} ${plural(a.d,'день','дні','днів')}`);
  return p.join(long ? ' · ' : ' ');
}
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2800);
}
function readPhoto(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1000/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .78));
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- Logo: півмісяць-колиска + сонячна крапка-малюк ---------- */
const mark = (w=40) => `<svg class="mark" width="${w}" height="${Math.round(w*.75)}" viewBox="4 9 40 30" aria-hidden="true">

/* Старі записи (Грудне, Суміш, Прикорм, Вода) → нова схема «Годування» */
const LEGACY_FEED = { 'Грудне':'Груди', 'Суміш':'Пляшечка', 'Прикорм':'Їжа', 'Вода':'Пляшечка' };
function normCare(e){
  if(LEGACY_FEED[e.type]) return { ...e, type:'Годування', feed:LEGACY_FEED[e.type], amount: e.type==='Вода' ? ['Вода', e.amount].filter(Boolean).join(' ') : e.amount };
  return e;
}
const sideLabel = s => s==='Права' ? 'R (права)' : s==='Ліва' ? 'L (ліва)' : '';
function feedLabel(e){
  if(e.feed==='Груди') return ['Груди', e.side==='Права' ? 'R' : e.side==='Ліва' ? 'L' : ''].filter(Boolean).join(' ');
  return e.feed==='Їжа' ? 'Їжа' : e.feed || 'Годування';
}
function dur(a, b){
  if(!a||!b) return '';
  const [h1,m1]=a.split(':').map(Number), [h2,m2]=b.split(':').map(Number);
  let m = (h2*60+m2)-(h1*60+m1); if(m<0) m+=1440;
  if(m===0) return 'менше хвилини';
  const h = Math.floor(m/60); return h ? `${h} год ${m%60} хв` : `${m} хв`;
}

/* ---------- Таймер сну й годування ---------- */
const timerOf = () => (child() && data.timers) ? data.timers[child().id] : null;
const defaultKind = (d=new Date()) => { const h = d.getHours(); return (h>=19 || h<6) ? 'Нічний' : 'Денний'; };
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function elapsed(ms){
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(x).padStart(2,'0');
}
const timerLabel = T => T.type==='Сон' ? `${T.kind||'Денний'} сон` : (T.type==='Груди' || T.type==='Грудне') ? ['Груди', sideLabel(T.kind)].filter(Boolean).join(' ') : T.type;
async function startTimer(type, kind){
  const c = child(); if(!c) return;
  if(data.timers[c.id]){ toast('Таймер уже йде. Спершу натисніть «Пауза».'); return; }
  const T = { type, kind: type==='Сон' ? (kind || defaultKind()) : (kind || ''), start: Date.now() };
  try{ await API.setTimer(c.id, T); }catch(e){ toast(errText(e)); return; }

async function stopTimer(btn){
  const c = child(), T = timerOf(); if(!T) return;
  const end = Date.now(), min = Math.max(1, Math.round((end-T.start)/60000));
  try{
    const saved = await busy(btn, async ()=>{
      const sleep = T.type==='Сон';
      const e = await API.saveEntry('care', { childId:c.id, date:iso(new Date(T.start)), from:hhmm(T.start), to:hhmm(end), note:'',
        ...(sleep ? { type:'Сон', kind:T.kind||defaultKind(new Date(T.start)) } : { type:'Годування', feed:'Груди', side:T.kind||'', amount:`${min} хв` }) });
      await API.setTimer(c.id, null); return e;
    });
    (data.entries.care = data.entries.care || []).push(saved);
    delete data.timers[c.id];
    renderApp(); const L = timerLabel(T); toast(`Збережено: ${L.charAt(0).toLowerCase()+L.slice(1)} ${hhmm(T.start)}–${hhmm(end)}.`);
  }catch(e){ toast(errText(e)); }
}
async function cancelTimer(){

function genitive(n){ // Софійка → Софійки, Марко → Марка (спрощено)
  if(/ка$/.test(n)) return n.replace(/ка$/,'ки');
  if(/я$/.test(n)) return n.replace(/я$/,'ї');
  if(/а$/.test(n)) return n.replace(/а$/,'и');
  if(/о$/.test(n)) return n.replace(/о$/,'а');
  if(/[йь]$/.test(n)) return n.replace(/[йь]$/,'я');
  if(/[бвгґджзклмнпрстфхцчшщ]$/i.test(n)) return n+'а';
  return n;
}

function chart(title, pts, unit, color){
  const W=320, H=150, P=26;
  const num = v => String(v).replace('.',',');
  if(pts.length<2) return `<div class="panel chart"><div class="cap"><span>${title}</span><b>${pts[0]?num(pts[0].v)+' '+unit:'—'}</b></div><p class="quiet">Графік з’явиться після двох вимірювань.</p></div>`;
  const t = pts.map(p=>new Date(p.d+'T12:00').getTime()), v = pts.map(p=>p.v);
  const t0=Math.min(...t), t1=Math.max(...t), v0=Math.min(...v), v1=Math.max(...v);
  const x = i => P + (t1===t0?0:(t[i]-t0)/(t1-t0))*(W-P*1.6);
  const y = i => (H-P) - (v1===v0?.5:(v[i]-v0)/(v1-v0))*(H-P*1.9);
  const path = pts.map((_,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(i).toFixed(1)}`).join('');
  return `<div class="panel chart"><div class="cap"><span>${title}</span><b>${num(v[v.length-1])} ${unit}</b></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: від ${num(v0)} до ${num(v1)} ${unit}">
    <line x1="${P}" y1="${H-P+6}" x2="${W-P*.6}" y2="${H-P+6}" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="${P}" y="${H-4}" font-size="11" fill="var(--muted)" font-family="Nunito,sans-serif">${fmtDate(pts[0].d)}</text>
    <text x="${W-P*.6}" y="${H-4}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="Nunito,sans-serif">${fmtDate(pts[pts.length-1].d)}</text>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(i)}" r="4.5" fill="var(--raised)" stroke="${color}" stroke-width="2"><title>${fmtDate(p.d)}: ${num(p.v)} ${unit}</title></circle>`).join('')}
  </svg></div>`;
}

async function fillTrash(){
  const el = document.getElementById('trash'); if(!el) return;
  let t; try{ t = await API.trash(); }catch(e){ el.innerHTML = `<p class="quiet">${esc(errText(e))}</p>`; return; }
  const left = d => Math.max(0, TRASH_DAYS - Math.floor((Date.now()-Date.parse(d))/864e5));
  const daysTxt = d => { const n = left(d); return n ? `ще ${n} ${plural(n,'день','дні','днів')}` : 'зникне сьогодні'; };
  const row = (kind, id, icon, tone, title, sub) => `<div class="trash-row" style="${toneVars(tone)}"><span class="sw">${ic(icon)}</span>
    <span class="b"><b>${esc(title)}</b><small>${esc(sub)}</small></span>
    <button class="btn soft" data-restore="${kind}|${id}">Повернути</button><button class="btn ghost" data-purge="${kind}|${id}">Видалити назавжди</button></div>`;
  const rows = [
    ...t.children.map(c=>row('child', c.id, 'baby', 'rose', c.name, `Профіль малюка з усіма записами · ${daysTxt(c.deleted_at)}`)),
    ...t.entries.map(({b,e})=>{ const B = BLOCKS[b]; if(!B) return ''; const C = B.card(e);
      return row('entry', e.id, B.icon, B.tone, C.word?`«${C.word}»`:(C.ttl||B.title), `${B.title} · ${t.names[e.childId]||''} · ${fmtDate(e.date)} · ${daysTxt(e.deleted_at)}`); }) ];
  el.innerHTML = rows.length ? `<div class="trash-list">${rows.join('')}</div>` : emptyState('Кошик порожній', 'Тут з’являться видалені записи. Їх можна буде повернути.');
}
async function exportAll(btn){
  if(!window.JSZip){ toast('Не вдалося підготувати архів. Оновіть сторінку.'); return; }
  try{
    await busy(btn, async ()=>{
      const d = await API.load(), zip = new window.JSZip(), photos = [];
      const ph = ref => { if(!ref) return ''; const n = `photos/${photos.length+1}.jpg`; photos.push([n, ref]); return n; };
      const clean = o => { const { _b, deleted_at, ...x } = o; return x; };
      const out = { exported_at:new Date().toISOString(), account:{ name:user.name, email:user.email, phone:user.phone },
        children: d.children.map(c=>({ ...clean(c), photo:ph(c.photo) })),
        sections: Object.fromEntries(Object.entries(BLOCKS).map(([b,B])=>[B.title, (d.entries[b]||[]).map(e=>({ ...clean(e), photo:ph(e.photo) }))])) };
      zip.file('koluska.json', JSON.stringify(out, null, 2));
      for(const [n, ref] of photos){ try{ zip.file(n, await API.photoBlob(ref)); }catch(e){} }
      const blob = await zip.generateAsync({ type:'blob' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `koluska-${today()}.zip`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    });
    toast('Архів готовий — шукайте його в завантаженнях.');
  }catch(e){ toast(errText(e)); }
}

  w.addEventListener('mousedown', e=>{ if(e.target===w) closeModal(); });
  document.body.appendChild(w);
  setTimeout(()=>w.querySelector('input:not([type=file]):not([type=hidden]),select,textarea,button')?.focus(), 30);
  return w;
}
const closeModal = () => document.getElementById('modal')?.remove();

function fieldHTML(f, val){
  const id = 'f-'+f.k, v = esc(val ?? (f.t==='date'?today():''));
  if(f.t==='photo') return `<div class="field"><label>${f.l}</label><div class="photo-box" data-photo="${f.k}">
      ${val&&API.photoUrl(val)?`<img src="${P(val)}" alt="">`:''}
      <label class="btn soft">${ic('camera')} ${val?'Замінити':'Додати фото'}<input type="file" accept="image/*" hidden></label>
      ${val?`<button type="button" class="btn ghost" data-rm-photo>Прибрати</button>`:''}
      <input type="hidden" name="${f.k}" value="${val?'__keep':''}"></div></div>`;
  let inp;
  if(f.t==='textarea') inp = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${v}</textarea>`;
  else if(f.t==='select') inp = `<select id="${id}" name="${f.k}">${f.opts.map(o=>{ const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${ov===val?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.t}" ${f.step?`step="${f.step}" inputmode="decimal"`:''} value="${v}" placeholder="${esc(f.ph||'')}" ${f.suggest?`list="dl-${f.k}"`:''}>${f.suggest?`<datalist id="dl-${f.k}">${f.suggest.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`:''}`;
  return `<div class="field" data-f="${f.k}"><label for="${id}">${f.l}</label>${inp}</div>`;
}
function fieldsHTML(fields, v){
  let out = '', buf = [];
  const flush = () => { if(buf.length===2) out += `<div class="row2">${buf.join('')}</div>`; else out += buf.join(''); buf = []; };
  fields.forEach(f=>{ if(f.half){ buf.push(fieldHTML(f, v[f.k])); if(buf.length===2) flush(); } else { flush(); out += fieldHTML(f, v[f.k]); } });
  flush(); return out;
}
function wireWhen(form, fields, onSync){
  const sync = () => {
    const v = {}; fields.forEach(f=>{ if(form.elements[f.k]) v[f.k] = form.elements[f.k].value; });
    fields.filter(f=>f.when).forEach(f=>form.querySelector(`[data-f="${f.k}"]`)?.classList.toggle('hidden', !f.when(v)));
    if(onSync) onSync(v);
  };
  form.addEventListener('change', sync); sync();
}
function wirePhotos(w, photos){
  w.querySelectorAll('[data-photo]').forEach(box=>{
    const k = box.dataset.photo;
    box.querySelector('input[type=file]').onchange = async ev => {
      const f = ev.target.files[0]; if(!f) return;
      try{ photos[k] = await readPhoto(f); }catch(e){ toast('Не вдалося відкрити фото. Спробуйте інше.'); return; }
      let img = box.querySelector('img'); if(!img){ img = document.createElement('img'); img.alt=''; box.prepend(img); }
      img.src = photos[k]; box.querySelector('input[type=hidden]').value='__new';
    };
    box.querySelector('[data-rm-photo]')?.addEventListener('click', ()=>{ photos[k]=''; box.querySelector('img')?.remove(); box.querySelector('input[type=hidden]').value=''; });
  });
}
function collect(form, fields, photos, prev){
  const out = {};
  for(const f of fields){
    const el = form.elements[f.k];
    if(f.t==='photo'){ const s = el.value; out[f.k] = s==='__new' ? photos[f.k] : s==='__keep' ? prev?.[f.k] : ''; if(f.req && !out[f.k]) throw 'Додайте фото.'; continue; }
    if(f.when && el.closest('.field')?.classList.contains('hidden')){ out[f.k] = ''; continue; }
    const v = el.value.trim();
    if(f.req && !v) throw `Заповніть «${f.l}».`;
    out[f.k] = v;
  }
  return out;
}

/* Власне вікно підтвердження: працює і в браузері, і в застосунку */
function ask(text, ok='Видалити'){
  return new Promise(res => {
    const w = document.createElement('div'); w.className='modal-wrap top';
    w.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" style="max-width:400px"><h3>${esc(text)}</h3>
      <div class="actions"><span class="sp"></span><button class="btn ghost" data-no>Пізніше</button><button class="btn primary" data-yes>${esc(ok)}</button></div></div>`;
    const done = v => { w.remove(); res(v); };
    w.querySelector('[data-no]').onclick = e => { e.stopPropagation(); done(false); };
    w.querySelector('[data-yes]').onclick = e => { e.stopPropagation(); done(true); };
    w.addEventListener('mousedown', e=>{ if(e.target===w) done(false); });
    document.body.appendChild(w); w.querySelector('[data-yes]').focus();
  });
}
function openLegal(k){
  const L = LEGAL[k];
  const w = document.createElement('div'); w.className='modal-wrap top';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(L.title)}</h3><div class="legal">${esc(L.text)}</div>
    <div class="actions"><span class="sp"></span><button class="btn primary" data-x>Зрозуміло</button></div></div>`;
  w.querySelector('[data-x]').onclick = e => { e.stopPropagation(); w.remove(); };
  w.addEventListener('mousedown', e=>{ if(e.target===w) w.remove(); });
  document.body.appendChild(w);
}
function openContact(){
  const tg = CONTACTS.telegram.replace(/^https?:\/\/t\.me\//,'@'), ig = CONTACTS.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//,'@');
  openModal(`<h3>Зв’язатися з нами</h3><p style="margin:-8px 0 16px;color:var(--muted)">Відповідаємо протягом дня.</p>
    <div class="contacts">
      <a href="mailto:${esc(CONTACTS.email)}" target="_blank" rel="noopener">${ic('mail')} Email <small>${esc(CONTACTS.email)}</small></a>
      <a href="${esc(CONTACTS.telegram)}" target="_blank" rel="noopener">${ic('send')} Telegram <small>${esc(tg)}</small></a>
      <a href="${esc(CONTACTS.instagram)}" target="_blank" rel="noopener">${ic('image')} Instagram <small>${esc(ig)}</small></a>
    </div>
    <div class="actions" style="margin-top:16px"><span class="sp"></span><button class="btn ghost" data-cancel>Закрити</button></div>`).querySelector('[data-cancel]').onclick = closeModal;
}
async function shareApp(){
  const text = 'Koluska — щоденник перших днів малюка. Записуйте кожне «вперше» за 10 секунд.';
  try{ if(navigator.share){ await navigator.share({ title:'Koluska', text, url:SITE }); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(`${text} ${SITE}`); toast('Посилання скопійовано. Надішліть його друзям.'); }
  catch(e){ openModal(`<h3>Розкажіть про нас</h3><div class="field"><label for="sh">Скопіюйте й надішліть</label><input id="sh" readonly value="${esc(SITE)}"></div>
    <div class="actions"><span class="sp"></span><button class="btn ghost" data-cancel>Закрити</button></div>`).querySelector('[data-cancel]').onclick = closeModal; }
}
const PROFILE_FIELDS = [ {k:'name',l:'Ваше ім’я',t:'text',req:1}, {k:'phone',l:'Номер телефону',t:'tel',req:1,ph:'+380 67 123 45 67'} ];
function openProfile(){
  const w = openModal(`<h3>Ваші дані</h3><form id="pf" novalidate>${fieldsHTML(PROFILE_FIELDS, { name:user.name, phone:fmtPhone(user.phone) })}<div class="err" id="pf-err" role="alert"></div>
    <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-cancel>Пізніше</button><button class="btn primary" type="submit">Зберегти</button></div></form>`);
  w.querySelector('[data-cancel]').onclick = closeModal;
  w.querySelector('#pf').onsubmit = async ev => {
    ev.preventDefault();
    try{
      const v = collect(ev.target, PROFILE_FIELDS, {}, null), phone = normPhone(v.phone);
      if(!phone) throw 'Перевірте номер телефону, напр. +380 67 123 45 67.';
      await busy(ev.submitter, ()=>API.updateProfile({ name:v.name, phone }));
      Object.assign(user, { name:v.name, phone }); closeModal(); renderApp(); toast('Збережено.');
    }catch(e){ w.querySelector('#pf-err').textContent = errText(e); }
  };
}

function openPicker(){
  openModal(`<h3>Що записуємо?</h3><div class="pick">${Object.entries(BLOCKS).map(([k,b])=>`<button style="${toneVars(b.tone)}" data-add="${k}"><span class="sw" style="background:var(--raised)">${ic(b.icon)}</span>${esc(b.title)}</button>`).join('')}</div>
  <div class="actions"><span class="sp"></span><button class="btn ghost" data-cancel>Пізніше</button></div>`).querySelector('[data-cancel]').onclick = closeModal;
}

function openEntry(b, id, preset){
  const B = BLOCKS[b], prev = id ? (data.entries[b]||[]).find(e=>e.id===id) : null;
  let v = { ...(preset||{}), ...(prev||{}) }; const photos = {};
  if(b==='care'){ v = normCare(v); if(!v.kind) v.kind = defaultKind(); }
  const canTime = b==='care' && !prev && !timerOf();
  const w = openModal(`<h3 style="${toneVars(B.tone)}"><span class="sw">${ic(B.icon)}</span>${prev?WORDS(b).edit:B.title}</h3>
    <form id="ef" novalidate>${fieldsHTML(B.fields, v)}<div class="err" id="ef-err" role="alert"></div>
    <div class="actions">${prev?`<button type="button" class="btn danger" data-del>Видалити</button>`:''}${canTime?`<button type="button" class="btn soft" data-form-start>${ic('play')} Почати таймер</button>`:''}<span class="sp"></span>
    <button type="button" class="btn ghost" data-cancel>Пізніше</button><button class="btn primary" type="submit">Зберегти</button></div></form>`);
  wirePhotos(w, photos);
  const tb = w.querySelector('[data-form-start]');
  wireWhen(w.querySelector('#ef'), B.fields, v => { if(tb) tb.classList.toggle('hidden', !(v.type==='Сон' || (v.type==='Годування' && v.feed==='Груди'))); });
  tb?.addEventListener('click', ()=>{ const f = w.querySelector('#ef').elements;
    if(f.type.value==='Сон') startTimer('Сон', f.kind.value); else startTimer('Груди', f.side.value); });
  w.querySelector('[data-cancel]').onclick = closeModal;
  w.querySelector('[data-del]')?.addEventListener('click', async ()=>{
    if(!await ask(WORDS(b).del)) return;
    try{ await API.deleteEntry(b, id); }catch(e){ toast(errText(e)); return; }
    data.entries[b] = data.entries[b].filter(e=>e.id!==id); closeModal(); renderApp(); toast(`${WORDS(b).deleted} Він у Кошику ${TRASH_DAYS} днів.`);
  });
  w.querySelector('#ef').onsubmit = async ev => {
    ev.preventDefault();
    try{
      const vals = collect(ev.target, B.fields, photos, prev);
      const saved = await busy(ev.submitter, async ()=>{
        for(const f of B.fields) if(f.t==='photo' && vals[f.k] && vals[f.k].startsWith('data:')) vals[f.k] = await API.uploadPhoto(vals[f.k]);
        return API.saveEntry(b, { ...(prev||{}), ...vals, id:prev?.id, childId:prev?.childId || child().id });
      });
      data.entries[b] = (data.entries[b] || []).filter(e=>e.id!==saved.id).concat(saved);
      closeModal(); renderApp(); toast(WORDS(b).saved);
    }catch(e){ w.querySelector('#ef-err').textContent = errText(e); }
  };
}

const CHILD_FIELDS = [ {k:'name',l:'Ім’я',t:'text',req:1}, {k:'birth',l:'День народження',t:'date',req:1,half:1}, {k:'sex',l:'Хто',t:'select',opts:['Дівчинка','Хлопчик'],half:1}, {k:'photo',l:'Фото',t:'photo'} ];
function openChild(id){
  const prev = id ? data.children.find(c=>c.id===id) : null, photos = {};
  const w = openModal(`<h3>${prev?'Профіль малюка':'Новий малюк'}</h3><form id="cf" novalidate>${fieldsHTML(CHILD_FIELDS, prev||{})}<div class="err" id="cf-err" role="alert"></div>
    <div class="actions">${prev?`<button type="button" class="btn danger" data-del>Видалити</button>`:''}<span class="sp"></span>
    <button type="button" class="btn ghost" data-cancel>Пізніше</button><button class="btn primary" type="submit">Зберегти</button></div></form>`);
  wirePhotos(w, photos);
  w.querySelector('[data-cancel]').onclick = closeModal;
  w.querySelector('[data-del]')?.addEventListener('click', async ()=>{
    if(!await ask(`Видалити профіль «${prev.name}» і всі його записи?`)) return;
    try{ await API.deleteChild(id); }catch(e){ toast(errText(e)); return; }
    data.children = data.children.filter(c=>c.id!==id);
    Object.keys(data.entries).forEach(b=>data.entries[b]=data.entries[b].filter(e=>e.childId!==id));
    setActive(data.children[0]?.id || null); closeModal(); renderApp(); toast(`Профіль у Кошику ${TRASH_DAYS} днів.`);
  });
  w.querySelector('#cf').onsubmit = async ev => {
    ev.preventDefault();
    try{
      const vals = collect(ev.target, CHILD_FIELDS, photos, prev);
      const saved = await busy(ev.submitter, async ()=>{
        if(vals.photo && vals.photo.startsWith('data:')) vals.photo = await API.uploadPhoto(vals.photo);
        return API.saveChild({ ...(prev||{}), ...vals, id:prev?.id });
      });
      data.children = data.children.filter(c=>c.id!==saved.id).concat(saved);
      if(!prev){ setActive(saved.id); view = 'overview'; }
      closeModal(); renderApp(); toast('Збережено.');
    }catch(e){ w.querySelector('#cf-err').textContent = errText(e); }
  };
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-close-menu]'); if(!t) return;
  const d = t.dataset, app = document.getElementById('app');
  if(d.tab){ authTab = d.tab; renderAuth(); }
  else if('demo' in d) startDemo();
  else if(d.nav){ view = d.nav; renderApp(); document.getElementById('main')?.scrollTo(0,0); }
  else if('collapse' in d){ collapsed = !collapsed; Store.set('collapsed', collapsed); app.classList.toggle('collapsed', collapsed); }
  else if('openMenu' in d) app.classList.add('open');
  else if('closeMenu' in d) app.classList.remove('open');
  else if('main' in d){ BLOCKS[view] ? openEntry(view) : openPicker(); }
  else if(d.add) openEntry(d.add, null, d.preset ? { title:d.preset } : null);
  else if(d.edit){ const [b,id] = d.edit.split(':'); openEntry(b, id); }
  else if('addChild' in d) openChild();
  else if(d.editChild) openChild(d.editChild);
  else if(d.pick){ setActive(d.pick); view='overview'; renderApp(); }
  else if('logout' in d){ API.signOut().finally(()=>{ user = null; data = null; view = 'overview'; boot(); }); }
  else if('forgot' in d) openForgot();
  else if('export' in d) exportAll(t);
  else if(d.restore){ const [kind, id] = d.restore.split('|'); t.disabled = true;
    API.restore(kind, id).then(async ()=>{ data = await API.load(); renderApp(); toast('Повернули на місце.'); }).catch(e=>{ t.disabled = false; toast(errText(e)); }); }
  else if(d.purge){ const [kind, id] = d.purge.split('|');
    ask('Видалити назавжди? Повернути вже не вийде.', 'Видалити').then(ok=>{ if(ok) API.purge(kind, id).then(fillTrash).catch(e=>toast(errText(e))); }); }
  else if(d.theme){ Store.set('theme', d.theme); applyTheme(); renderApp(); }
  else if('timerStop' in d) stopTimer(t);
  else if('timerCancel' in d) cancelTimer();
  else if(d.start){ const [type, kind] = d.start.split('|'); startTimer(type, kind); }
  else if('profile' in d) openProfile();
  else if(d.news){ const v = d.news==='1'; API.updateProfile({ news:v }).then(()=>{ user.news = v; renderApp(); }).catch(e=>toast(errText(e))); }
  else if(d.legal) openLegal(d.legal);
  else if('contact' in d) openContact();
  else if('share' in d) shareApp();
  else if('wipe' in d){ ask(`Перенести всіх малюків і записи в Кошик? Їх можна повернути протягом ${TRASH_DAYS} днів.`, 'Перенести').then(async ok=>{ if(!ok) return;
    try{ await API.wipe(); data = await API.load(); setActive(null); view='overview'; renderApp(); }catch(e){ toast(errText(e)); } }); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); document.getElementById('app')?.classList.remove('open'); } });

function openForgot(){
  const w = document.createElement('div'); w.className='modal-wrap top';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:420px"><h3>Новий пароль</h3>
    <p style="margin:-8px 0 16px;color:var(--muted)">Надішлемо посилання для зміни пароля.</p>
    <form novalidate><div class="field"><label for="fg">Email</label><input id="fg" type="email" autocomplete="email" value="${esc(draft.email)}"></div><div class="err" role="alert"></div>
    <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-x>Пізніше</button><button class="btn primary" type="submit">Надіслати</button></div></form></div>`;
  const close = () => w.remove();
  w.querySelector('[data-x]').onclick = e => { e.stopPropagation(); close(); };
  w.querySelector('form').onsubmit = async ev => {
    ev.preventDefault(); const email = w.querySelector('#fg').value;
    try{ await busy(ev.submitter, ()=>API.resetPassword(email)); close(); authInfo = `Лист для зміни пароля надіслано на ${email.trim()}.`; renderAuth(); }
    catch(e){ w.querySelector('.err').textContent = errText(e); }
  };
  document.body.appendChild(w); w.querySelector('#fg').focus();
}
function openNewPassword(){
  const w = openModal(`<h3>Придумайте новий пароль</h3><form id="np" novalidate><div class="field"><label for="np1">Новий пароль</label><input id="np1" type="password" autocomplete="new-password" placeholder="Щонайменше 6 символів"></div>
    <div class="err" role="alert"></div><div class="actions"><span class="sp"></span><button class="btn primary" type="submit">Зберегти</button></div></form>`);
  w.querySelector('#np').onsubmit = async ev => {
    ev.preventDefault(); const pw = w.querySelector('#np1').value;
    if(pw.length < 6){ w.querySelector('.err').textContent = 'Пароль — щонайменше 6 символів.'; return; }
    try{ await busy(ev.submitter, ()=>API.updatePassword(pw)); closeModal(); toast('Пароль змінено.'); }
    catch(e){ w.querySelector('.err').textContent = errText(e); }
  };
}

let recovering = false;
if(CLOUD) sb.auth.onAuthStateChange(ev => {
  if(ev==='PASSWORD_RECOVERY'){ recovering = true; if(user) openNewPassword(); }
});

async function boot(){
  applyTheme();
  document.getElementById('root').innerHTML = `<div class="loading"><div>${mark(64)}Відкриваємо щоденник…</div></div>`;
  try{
    user = await API.getUser();
    if(!user){ renderAuth(); return; }
    data = await API.load();
    activeId = Store.get('active:'+user.id, null);
    renderApp();
    if(recovering){ recovering = false; openNewPassword(); }
  }catch(e){
    document.getElementById('root').innerHTML = `<div class="loading"><div>${mark(64)}${esc(errText(e))}<br><br><button class="btn primary" onclick="boot()">Спробувати ще раз</button></div></div>`;
  }
}
boot();
</script>
